name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install lint tools
        run: uv sync --only-group dev --no-install-project

      - name: Check style
        run: uv run --no-sync ruff check --output-format=github src tests docker

      - name: Check formatting
        run: uv run --no-sync ruff format --check --diff src tests docker

      - name: Check workflows
        run: uv run --no-sync zizmor --persona=regular .github/workflows

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra test --extra api --extra openai-compatible

      - name: Run unit tests
        run: uv run --no-sync python -m unittest discover -s tests -v

  container:
    name: Build openai-compatible image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: openai-compatible
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=openai-compatible
