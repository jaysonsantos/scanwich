[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scanwich"
version = "0.1.0"
description = "Make searchable sandwich PDFs with pluggable OCR backends"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jayson Reis" }]
dependencies = [
  "Pillow>=10",
  "pypdfium2>=5.11",
  "reportlab>=4",
]

[project.optional-dependencies]
easyocr = ["easyocr>=1.7.2"]
openai-compatible = ["openai>=1.0"]
api = [
  "fastapi>=0.115",
  "pydantic>=2",
  "pydantic-settings>=2.5",
  "uvicorn>=0.30",
  "python-multipart>=0.0.18",
]
test = ["pypdf>=5", "httpx>=0.27"]

[project.scripts]
scanwich = "scanwich.cli:main"
scanwich-api = "scanwich.api:main"

[project.entry-points."scanwich.ocr_backends"]
easyocr = "scanwich.backends.easyocr:factory"
openai-compatible = "scanwich.backends.openai_compatible:factory"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["ruff==0.16.6", "zizmor==1.30.1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "N",    # pep8 naming
  "UP",   # pyupgrade
  "B",    # bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "ISC",  # implicit string concatenation
  "PTH",  # prefer pathlib
  "TID",  # tidy imports
  "RUF",  # ruff-specific rules
]
ignore = [
  "E501",  # line length is handled by the formatter
]
